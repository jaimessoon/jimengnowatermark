<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Link Extractor & Downloader</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Extractor">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
        /* Modern mobile-first stylesheet UI layout */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: #f2f2f7; /* Matches iOS system background appearance */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #1c1c1e;
            margin: 0 0 8px 0;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
        }
        p {
            color: #8e8e93;
            font-size: 14px;
            text-align: center;
            margin: 0 0 20px 0;
        }
        textarea {
            width: 100%;
            height: 130px;
            padding: 14px;
            border: 1px solid #d1d1d6;
            border-radius: 12px;
            resize: none;
            font-size: 16px; /* 16px font size effectively prevents iOS auto-zoom on selection focus */
            background-color: #f2f2f7;
            color: #1c1c1e;
            font-family: inherit;
            margin-bottom: 20px;
        }
        textarea:focus {
            outline: none;
            border-color: #007aff; /* Apple Blue accent color highlighting */
            background-color: #ffffff;
        }
        button {
            width: 100%;
            background-color: #007aff;
            color: white;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active {
            background-color: #0056b3;
            transform: scale(0.99);
        }
        .status {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Extractor Tool</h2>
    <p>Paste the raw app message below</p>
    
    <textarea id="rawInput" placeholder="Paste full text here..."></textarea>
    
    <button onclick="processAndRedirect()">Extract, Copy & Open</button>
    
    <div id="statusMessage" class="status"></div>
</div>

<script>
function processAndRedirect() {
    const rawText = document.getElementById('rawInput').value;
    const statusDiv = document.getElementById('statusMessage');
    
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    const match = rawText.match(urlRegex);
    
    if (match && match[0]) {
        const extractedUrl = match[0];
        
        try {
            // Fix: Create a hidden text element to guarantee fallback support on iOS
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = extractedUrl;
            tempTextArea.style.position = "absolute";
            tempTextArea.style.left = "-9999px";
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            tempTextArea.setSelectionRange(0, 99999); // Ensures complete text selection coverage on mobile devices
            
            // Native fallback wrapper system triggers copying behavior instantaneously
            document.execCommand("copy");
            document.body.removeChild(tempTextArea);
            
            statusDiv.style.color = '#34c759';
            statusDiv.innerText = "✓ URL copied! Opening downloader...";
            
            document.getElementById('rawInput').value = '';
            
            // Fix: Triggers the new window redirection sequence synchronously with the user action context
            window.open("https://savevideoraw.com/jimeng", "_blank");
            
        } catch (err) {
            statusDiv.style.color = '#ff3b30';
            statusDiv.innerText = "Copy process execution failed.";
        }
        
    } else {
        statusDiv.style.color = '#ff3b30';
        statusDiv.innerText = "❌ Valid link not detected.";
    }
}
</script>

</body>
</html>
